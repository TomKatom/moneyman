# Builds the image the lab cluster runs: upstream's unmodified Dockerfile over
# the lab/hapoalim branch.
#
# Every push to the branch is tested and built, so a rebase that breaks anything
# fails here, before the lab repo knows about it. Only a `<upstream tag>-lab.<n>`
# tag publishes — the last step of the rebase ritual in LAB.md. No `latest`: the
# lab pins by digest.
name: Lab image

on:
  push:
    branches: [lab/hapoalim]
    tags: ["v*-lab.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: npm run lint
      - run: npm run build
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: startsWith(github.ref, 'refs/tags/')
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=ref,event=tag

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: moneyman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The persistent profile is what makes Hapoalim's device trust stick, and a
      # Chromium bump in the base image is the likeliest thing to break it.
      - name: Browser profile survives a killed run
        run: |
          docker run --rm --entrypoint sh moneyman:ci -c \
            'MONEYMAN_BROWSER_PROFILE_PATH=$(mktemp -d) node dst/scripts/verify-browser-profile.js'

      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: startsWith(github.ref, 'refs/tags/')
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
          sbom: false

      - if: startsWith(github.ref, 'refs/tags/')
        name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${TAGS}@${DIGEST}"
            echo '```'
            echo
            echo "Bump \`clusters/lab/apps/moneyman-hapoalim.yaml\` in TomKatom/lab to this."
          } >> "$GITHUB_STEP_SUMMARY"
